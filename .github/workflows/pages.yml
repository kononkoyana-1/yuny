# Production web on GitHub Pages, on every push to master (and on demand):
#
#   backend — brings the Supabase project up to master: pending migrations,
#             every Edge Function, the site's address among Auth redirects;
#             hands the build the publishable key and whether Google sign-in
#             is on in the project;
#   build   — exports apps/mobile for the web against that project;
#   deploy  — publishes it.
#
# Needs one repository secret, SUPABASE_ACCESS_TOKEN — a Supabase personal
# access token (supabase.com → Account → Access Tokens). It is used by the
# backend job only; the build gets nothing but the public key.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the one in progress, so
# two runs never migrate the database at once.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ixtfifglohppaimvyvui
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      publishable_key: ${{ steps.web.outputs.publishable_key }}
      google_enabled: ${{ steps.web.outputs.google_enabled }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require the Supabase token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only migrations missing from the project's journal, oldest first; stops
      # without touching anything if the journal and the files disagree.
      - name: Apply pending migrations
        run: node scripts/db-apply-pending.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Every function in supabase/functions, bundled by the API (no Docker).
      # The API answers 500 «Function deploy failed due to an internal error»
      # now and then (three times on words-extract by 2026-09-24) and the same
      # upload succeeds on the next try — so up to three attempts.
      - name: Deploy Edge Functions
        run: |
          for attempt in 1 2 3; do
            if supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api; then
              exit 0
            fi
            echo "::warning::functions deploy failed (attempt $attempt of 3)"
            sleep 15
          done
          exit 1

      - name: Auth redirects and the public key
        id: web
        run: node scripts/supabase-web-setup.mjs "$SITE_URL"

  build:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Export the web build
        working-directory: apps/mobile
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_WEB_OUTPUT: single
          EXPO_PUBLIC_DATA_SOURCE: supabase
          EXPO_PUBLIC_SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ needs.backend.outputs.publishable_key }}
          EXPO_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          # The Google button shows only when the project has the provider on.
          EXPO_PUBLIC_GOOGLE_SIGN_IN: ${{ needs.backend.outputs.google_enabled == 'true' && 'enabled' || 'disabled' }}
        run: npx expo export --platform web --output-dir dist --clear

      # Deep links (/yuny/folder/<id>) reach Pages as 404s; the SPA shell
      # answers them and the router reads the URL. `.nojekyll` keeps the
      # `_expo/` folder from being dropped as a Jekyll-private path.
      - name: SPA fallback
        working-directory: apps/mobile/dist
        run: |
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
